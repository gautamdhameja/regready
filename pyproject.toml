[project]
name = "regready"
version = "0.1.0"
description = "Retrieval and citation of provisions in five EU digital regulations"
readme = "README.md"
authors = [
    { name = "Gautam Dhameja", email = "gautamdhameja@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docling>=2.137.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
